[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imdsoc"
version = "0.1.0"
description = "Reference implementation of a regulation-aware, cost-optimized pharmacy fulfillment architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["imdsoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
